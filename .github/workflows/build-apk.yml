name: Build APK

on:
  push:
    branches: [main]
    # A version tag, e.g. v1.0.0, publishes that version as its own release.
    tags: ['v*']
  workflow_dispatch:

# Only the newest build matters; cancel older ones still running.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Every APK must be signed with the same key, or it won't install over
      # the previous one. Fail rather than silently fall back to a debug key.
      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Signing secrets are missing. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD and KEY_ALIAS under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF

      # The run number becomes the Android version code, so every build is
      # newer than the last and shows up as e.g. "0.1.0 (build 7)".
      - run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            dist/kipto.apk

      # Downloadable from the run's summary page (zipped, kept 30 days).
      - uses: actions/upload-artifact@v4
        with:
          name: kipto
          path: dist/*.apk
          retention-days: 30

      # A version tag gets its own release, shown as the latest on GitHub.
      - name: Publish version release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --verify-tag \
            --latest \
            --title "Kipto ${GITHUB_REF_NAME#v}" \
            --notes "Kipto ${GITHUB_REF_NAME#v} (build ${GITHUB_RUN_NUMBER}). Settings shows which version is installed."

      # Everything else updates a rolling "latest" pre-release, so the newest
      # APK always has a direct, unzipped download link that works from a phone.
      - name: Publish to latest pre-release
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: latest
        run: |
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" dist/*.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Build ${GITHUB_RUN_NUMBER}" \
            --notes "Build ${GITHUB_RUN_NUMBER}, from commit ${GITHUB_SHA::7}. Settings shows which build is installed."
