name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the newest build matters; cancel older ones still running.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Every APK must be signed with the same key, or it won't install over
      # the previous one. Fail rather than silently fall back to a debug key.
      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Signing secrets are missing. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD and KEY_ALIAS under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF

      - run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            dist/expense-tracker.apk

      # Downloadable from the run's summary page (zipped, kept 30 days).
      - uses: actions/upload-artifact@v4
        with:
          name: expense-tracker
          path: dist/*.apk
          retention-days: 30

      # A rolling "latest" release, so the newest APK always has a
      # direct, unzipped download link that works from a phone.
      - name: Publish to latest release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: latest
        run: |
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" dist/*.apk \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7}."
